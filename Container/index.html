<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Container Demo</title>
    <!-- Tailwind CSS CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <!-- Header Section -->
    <header class="bg-blue-600 text-white py-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">My Website</h1>
            <nav class="space-x-4">
                <a href="#" class="hover:underline">Home</a>
                <a href="#" class="hover:underline">About</a>
                <a href="#" class="hover:underline">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="py-10">
        <div class="container mx-auto px-4 bg-white p-6 rounded-lg shadow">
            <h2 class="text-3xl font-bold mb-4">Welcome to My Website</h2>
            <p class="text-gray-700 mb-4">
                এখানে Tailwind CSS এর <code>container</code> ব্যবহার করা হয়েছে।
                এটি content কে responsive এবং সুন্দরভাবে center করে রাখে।
            </p>
            <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                Learn More
            </button>
        </div>
    </main> 

    <!-- Footer Section -->
    <footer class="bg-gray-800 text-gray-300 py-4 mt-10">
        <div class="container mx-auto">
            <p>&copy; 2025 My Website. All Rights Reserved.</p>
        </div>
    </footer>

</body>

</html>
